info:
  name: Login
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: '{"pseudo":"testeur","password":"1234"}'

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
